name: Validate RoadScope
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env: {POSTGRES_USER: roadscope, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: roadscope_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roadscope -d roadscope_test" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://roadscope:ci-only-password@localhost:5432/roadscope_test
      TEST_POSTGIS_URL: postgresql+psycopg://roadscope:ci-only-password@localhost:5432/roadscope_test
      JWT_SECRET: ci-only-signing-secret-not-for-production-1234
      INTERNAL_API_KEY: ci-only-service-secret-not-for-production-1234
      DEMO_MODE: "true"
      INFERENCE_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m scripts.smoke
      - run: python -m compileall -q backend inference ml scripts
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - run: python scripts/init_env.py && docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failure-report, path: frontend/test-results}
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker build -f backend/Dockerfile . && docker build -f inference/Dockerfile . && docker build -f frontend/Dockerfile .

